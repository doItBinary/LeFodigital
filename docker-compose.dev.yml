services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: dev
      EVIDENCE_STORAGE_PATH: /app/data/evidence
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    entrypoint:
      - /bin/sh
      - -c
      - alembic upgrade head && python -m app.seed && exec "$$@"
      - --
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - evidence_dev:/app/data/evidence
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

volumes:
  evidence_dev:

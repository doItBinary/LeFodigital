name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prj_grado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prj_grado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/prj_grado_test
      JWT_SECRET_KEY: ci-only-secret-with-more-than-thirty-two-characters
      TEACHER_INVITATION_CODE: CI-DOCENTE
      EVIDENCE_STORAGE_PATH: /tmp/lefodigital-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked environment files
        run: |
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$')"
      - name: Reject common private-key patterns
        run: |
          ! git grep -E '(sk-proj-|gsk_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!.github/workflows/ci.yml'

  publish-images:
    name: Publish private Docker images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - repository-safety
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      REGISTRY_IMAGE: ${{ vars.GITLAB_REGISTRY_IMAGE }}
      REGISTRY_USERNAME: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry configuration
        run: |
          if [ -z "$REGISTRY_IMAGE" ]; then
            echo "Set the repository variable GITLAB_REGISTRY_IMAGE, for example registry.gitlab.com/namespace/lefodigital."
            exit 1
          fi
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "Set the GitHub secrets GITLAB_REGISTRY_USERNAME and GITLAB_REGISTRY_TOKEN."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/backend:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}/backend:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}/frontend:latest
